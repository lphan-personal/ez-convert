<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EZ Convert — wheel</title>
  <link rel="stylesheet" href="wheel.css" />
</head>
<body>
  <!-- (A) wheel overlay prototype, SPEC.md §1/§2. No inline script or style:
       the shipped CSP is default-src 'self'. Everything below is generated by
       wheel.js from model.js — the DOM never computes geometry itself. -->
  <main class="stage">
    <div class="wheel" id="wheel" role="application" aria-label="Conversion wheel" tabindex="0" aria-describedby="wheel-help">
      <div class="surface material" id="surface" aria-hidden="true"></div>
      <div class="hub material" id="hub" aria-hidden="true">
        <span class="hub-kicker" id="hub-kicker">Image detected</span>
        <span class="hub-value" id="hub-value">Pick a format</span>
      </div>
      <svg class="ring" id="ring" viewBox="0 0 520 520" aria-hidden="true"></svg>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div class="notch" aria-hidden="true"></div>
    </div>

    <div class="demo" id="demo">
      <span class="demo-label" id="wheel-help">Prototype input</span>
      <button type="button" data-kind="image" class="on">Image</button>
      <button type="button" data-kind="video">Video</button>
      <button type="button" data-kind="document">Document</button>
      <button type="button" data-kind="audio">Audio</button>
      <button type="button" data-kind="unknown">Unknown</button>
      <span class="demo-hint">Drag around the ring to spin it · click a segment to convert · Esc dismisses</span>
    </div>

    <ol class="log" id="events" aria-live="polite" aria-label="Recorded events"></ol>
  </main>

  <script src="model.js"></script>
  <script src="spring.js"></script>
  <script src="wheel.js"></script>
  <!-- The bridge to the real window. Inert in a plain browser: it returns early
       when `window.__TAURI__` is absent, so the prototype stays a prototype. -->
  <script src="overlay.js"></script>
</body>
</html>
