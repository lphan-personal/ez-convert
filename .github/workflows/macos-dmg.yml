name: macos-dmg

# macOS packaging (P3): a universal app DMG and the separate engine pack, both
# built on the GitHub-hosted macOS runner, then installed and exercised on it.
#
# Why a separate workflow: the Windows install path is P2's, and this job needs
# a macOS runner plus a much longer budget than the 3-OS build matrix. The two
# never share a checkout step.
#
# Results are published to the `macos-status` branch (Contents scope is enough,
# the Actions API is not available to packaging agents): one directory per run
# with the logs and a facts.json.

on:
  # Cost control (decision A, 2026-11-02): this workflow was the single largest
  # Actions consumer - a macOS runner plus a long packaging budget on every push
  # that touched src-tauri/**. macOS now builds on a tag push (v*) or on demand.
  # To iterate the DMG, dispatch it explicitly:
  #   gh workflow run macos-dmg.yml            (or POST /actions/workflows/macos-dmg.yml/dispatches)
  # A tag ending in `-app` runs only the app job and `-pack` only the engine
  # pack (each face of this workflow has its own card); a plain `v*` tag and
  # workflow_dispatch run both. Skipped jobs leave the run green, so a partial
  # iteration still gives a readable verdict instead of a red X for work that
  # was never asked to happen.
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  EZC_VERSION: "0.0.1"

jobs:
  # ------------------------------------------------------------- app DMG
  app:
    name: app (universal DMG)
    runs-on: macos-latest
    # Cheap-iteration guard (2026-11-02, t_0e2a0904): two cards own this
    # workflow — the app DMG and the engine pack — and a full run bills ~47
    # macOS minutes because both jobs run whatever you are actually debugging.
    # A tag ending `-app` runs only this job; `-pack` runs only the pack. Plain
    # `v*` tags and workflow_dispatch still run everything.
    if: github.event_name != 'push' || !endsWith(github.ref_name, '-pack')
    # Spend guard (2026-11-02): a macOS minute bills at 10x. This job has
    # never needed more than a few minutes; cap it so a hang cannot eat the quota.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Icon for macOS (icns from the committed PNGs)
        run: |
          set -euo pipefail
          src=src-tauri/icons/icon.png
          [ -f "$src" ] || src=src-tauri/icons/icon-256.png
          rm -rf /tmp/icon.iconset && mkdir -p /tmp/icon.iconset
          for spec in "16 16x16" "32 16x16@2x" "32 32x32" "64 32x32@2x" "128 128x128" "256 128x128@2x" "256 256x256" "512 256x256@2x" "512 512x512" "1024 512x512@2x"; do
            size=${spec%% *}; name=${spec##* }
            sips -z "$size" "$size" "$src" --out "/tmp/icon.iconset/icon_${name}.png" >/dev/null
          done
          iconutil -c icns /tmp/icon.iconset -o src-tauri/icons/icon.icns
          file src-tauri/icons/icon.icns

      - name: Tauri CLI
        run: |
          set -euo pipefail
          npm install -g @tauri-apps/cli@^2 >/dev/null
          tauri --version

      - name: Rust toolchain (both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri.macos.conf.json` turns bundling on and keeps the platform details
      # (dmg layout, minimum macOS, ad-hoc identity) out of the shared config
      # that the Windows installer card owns.
      - name: tauri build (universal)
        run: |
          set -o pipefail
          tauri build --target universal-apple-darwin \
            --config src-tauri/tauri.macos.conf.json 2>&1 | tee tauri-build.log

      - name: Sign inside-out (ad-hoc for v1)
        run: bash packaging/macos/sign-app.sh "${{ github.workspace }}/src-tauri/target/universal-apple-darwin/release/bundle/macos/EZ Convert.app"

      - name: Verify the bundle and both architectures
        run: |
          set -euo pipefail
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/EZ Convert.app"
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tee -a sign.log || true
          codesign --verify --strict "$app"
          lipo -archs "$app/Contents/MacOS/ez-convert" | tee -a sign.log
          lipo -archs "$app/Contents/MacOS/ez-convert" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/ez-convert" | grep -q x86_64
          echo "bundle: OK $(du -sh "$app" | cut -f1)"

      # The bundle must stay engine-free. Tauri's resource copy flattens `.app`
      # symlinks, so an engine tree under Contents/Resources would be both
      # unsigned and broken (docs/MACOS-PACKAGING.md §1). Asserting the shape —
      # rather than trusting the config that happens to be correct today — is what
      # turns "no LibreOffice in Contents/Resources" into a CI fact: the Windows
      # bundle config does copy `resources/engines` and shares this source tree.
      - name: Bundle shape gate (no engine payload, Resources = assets only)
        run: |
          set -euo pipefail
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/EZ Convert.app"
          echo "== every file in the bundle =="
          ( cd "$app" && find . -type f | sort ) | tee bundle-files.txt
          echo "files in bundle: $(wc -l < bundle-files.txt | tr -d ' ')"
          echo "== Contents/Resources =="
          find "$app/Contents/Resources" -type f | sort

          extra=$(find "$app/Contents/Resources" -type f ! -name 'icon.icns' | sort)
          if [ -n "$extra" ]; then
            echo "::error::Contents/Resources holds more than icon.icns"
            printf '%s\n' "$extra"
            exit 1
          fi

          payload=$(find "$app" \( -iname '*soffice*' -o -iname '*libreoffice*' \
              -o -iname '*vips*' -o -iname 'ffmpeg*' -o -iname 'ffprobe*' \
              -o -iname 'engines' \) -print | sort)
          if [ -n "$payload" ]; then
            echo "::error::an engine payload is inside the app bundle — engines ship in the separate pack (docs/MACOS-PACKAGING.md §1)"
            printf '%s\n' "$payload"
            exit 1
          fi
          for d in engines program; do
            if [ -d "$app/Contents/Resources/$d" ]; then
              echo "::error::Contents/Resources/$d exists in the bundle"
              exit 1
            fi
          done
          echo "bundle shape: OK — Contents/Resources holds icon.icns only, no engine payload"

      - name: Package and rename the DMG
        run: |
          set -euo pipefail
          src=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          [ -n "$src" ] || { echo "::error::tauri produced no DMG"; exit 1; }
          mkdir -p dist
          cp "$src" "dist/EZ-Convert-${EZC_VERSION}-macos-universal.dmg"
          codesign --force --sign - "dist/EZ-Convert-${EZC_VERSION}-macos-universal.dmg"
          shasum -a 256 "dist/EZ-Convert-${EZC_VERSION}-macos-universal.dmg" | tee dist/app-dmg.sha256
          ls -lh dist

      # warden's Q2 condition (handed over from t_18165ce9): everything that
      # ships attributes to a docs/shipped-inventory.tsv row, fail-closed, before
      # the artifact is uploaded. Root is the `.app` on the mounted volume — the
      # only other files there are `.VolumeIcon.icns` (own row) and a symlink.
      # Before this step existed the app DMG had never been through the gate.
      - name: Licence gate over the DMG payload (fail-closed attribution)
        run: |
          set -euo pipefail
          dmg="dist/EZ-Convert-${EZC_VERSION}-macos-universal.dmg"
          mnt="$RUNNER_TEMP/app-scan-mnt"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
          app=$(find "$mnt" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$app" ]; then
            hdiutil detach "$mnt" >/dev/null || true
            echo "::error::no .app on the mounted DMG"
            exit 1
          fi
          set +e
          bash scripts/dist-license-gate.sh --scan "$app" 2>&1 | tee licence-gate.log
          code=${PIPESTATUS[0]}
          set -e
          hdiutil detach "$mnt" >/dev/null || hdiutil detach -force "$mnt" >/dev/null || true
          [ "$code" -eq 0 ] || { echo "::error::the app DMG failed the licence gate"; exit "$code"; }
          echo "licence gate: every file in the app DMG payload is attributed"

      - name: Upload the app DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-dmg
          path: dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Evidence
        if: always()
        run: bash packaging/macos/publish-evidence.sh app "${{ job.status }}" tauri-build.log sign.log bundle-files.txt licence-gate.log

  # --------------------------------------------------------- engine pack
  pack:
    name: pack (engine pack DMG)
    runs-on: macos-latest
    # The other half of the cheap-iteration guard above: `*-pack` tags run only
    # this job (engine-pack iteration, t_90b19752).
    if: github.event_name != 'push' || !endsWith(github.ref_name, '-app')
    # Spend guard (2026-11-02): a macOS minute bills at 10x. The job now also
    # hashes the ~700 MB pack, codesign-verifies every Mach-O object in it and
    # mounts the DMG to re-verify the artifact (step 8b), so the cap moved from
    # 20 to 35 minutes: a timeout here destroys the only evidence that the pack
    # builds at all, which is more expensive than the minutes it saves.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # The manifest logic is pure python and runs anywhere: test it here, in
      # seconds, before a ~20-minute billed macOS build depends on it.
      - name: Unit-test the pack manifest (fail-closed mutations)
        run: bash scripts/test-pack-manifest.sh

      # Build dependencies for the LGPL ffmpeg (no GPL library is installed):
      # libvpx BSD, aom BSD, opus BSD, libvorbis BSD, lame LGPL-2.1. pkgconf is
      # how configure finds them; the build is arm64 so nasm is not needed.
      # The formula is `aom`, not `libaom` — the configure flag is the only place
      # that name appears. The whole output goes to brew.log: a `| tail -5`
      # here is what hid the missing-formula error on run #3.
      - name: Install engine dependencies
        run: |
          set -o pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install libvpx aom opus libvorbis lame pkgconf vips 2>&1 | tee brew.log
          brew list --versions libvpx aom opus libvorbis lame pkgconf vips | tee -a brew.log
          pkg-config --modversion vpx aom opus vorbis 2>&1 | tee -a brew.log

      - name: Build, strip, sign and package the engine pack
        run: |
          set -o pipefail
          EZC_WORK="$RUNNER_TEMP/ezc-pack" bash scripts/mac-engine-pack.sh --out dist 2>&1 | tee pack.log

      - name: Assert the published pins are next to the DMG
        # The DMG carries MANIFEST.json + MANIFEST.sha256 inside; the sidecar and
        # .sha256 beside it are what a download is checked against. Uploading the
        # DMG alone would ship the artifact without its pins.
        run: |
          set -euo pipefail
          ls -l dist
          dmg=$(find dist -name 'EZ-Convert-Engine-Pack-*.dmg' | head -1)
          [ -n "$dmg" ] || { echo "::error::no engine-pack DMG in dist"; exit 1; }
          for pin in "$dmg.sha256" "$dmg.manifest.json"; do
            [ -f "$pin" ] || { echo "::error::missing $(basename "$pin")"; exit 1; }
          done
          grep -q '"version":' "$dmg.manifest.json" || { echo "::error::sidecar has no version"; exit 1; }
          grep -q '"sha256":' "$dmg.manifest.json" || { echo "::error::sidecar has no digest"; exit 1; }
          echo "pins: $(basename "$dmg"), $(basename "$dmg").sha256, $(basename "$dmg").manifest.json"

      - name: Upload the engine pack
        uses: actions/upload-artifact@v4
        with:
          name: macos-engine-pack
          path: dist/**
          if-no-files-found: error
          retention-days: 30

      - name: Evidence
        if: always()
        run: bash packaging/macos/publish-evidence.sh pack "${{ job.status }}" pack.log brew.log

  # ------------------------------------------------- install + convert test
  install-test:
    name: install-test (DMG install + real conversions)
    needs: [app, pack]
    runs-on: macos-latest
    # Spend guard (2026-11-02): a macOS minute bills at 10x. This job has
    # never needed more than a few minutes; cap it so a hang cannot eat the quota.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download both DMGs
        uses: actions/download-artifact@v4
        with:
          path: in

      - name: Install the app from its DMG
        run: |
          set -euo pipefail
          appdmg=$(find in -name 'EZ-Convert-*-macos-universal.dmg' | head -1)
          [ -n "$appdmg" ] || { echo "::error::no app DMG artifact"; exit 1; }
          mnt="$RUNNER_TEMP/app-mnt"; mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$appdmg" >/dev/null
          ls -la "$mnt" | tee install.log
          # Install the way a user does: drag the app to /Applications.
          sudo rm -rf "/Applications/EZ Convert.app"
          sudo ditto "$mnt/EZ Convert.app" "/Applications/EZ Convert.app"
          hdiutil detach "$mnt" >/dev/null
          /usr/sbin/pkgutil --pkgs >/dev/null 2>&1 || true
          ls -la "/Applications/EZ Convert.app/Contents"
          lipo -archs "/Applications/EZ Convert.app/Contents/MacOS/ez-convert" | tee -a install.log
          codesign --verify --strict "/Applications/EZ Convert.app" | tee -a install.log
          # App Translocation is the classic "works in target/, dies from /Applications" bug;
          # running it from /Applications is the point of this job.
          echo "installed: $(du -sh "/Applications/EZ Convert.app" | cut -f1)" | tee -a install.log

      - name: Install the engine pack from its DMG
        run: |
          set -euo pipefail
          packdmg=$(find in -name 'EZ-Convert-Engine-Pack-*.dmg' | head -1)
          [ -n "$packdmg" ] || { echo "::error::no engine-pack DMG artifact"; exit 1; }
          mnt="$RUNNER_TEMP/pack-mnt"; mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$packdmg" >/dev/null
          bash "$mnt/Install Engine Pack.command" 2>&1 | tee install-pack.log
          hdiutil detach "$mnt" >/dev/null
          ls -la "$HOME/Library/Application Support/app.ezconvert.desktop/engines" | tee -a install-pack.log

      - name: Verify the installed pack and that the app carries no engines
        # The acceptance for the external pack: the installed tree matches its
        # version/checksum manifest, keeps every symlink, keeps a valid ad-hoc
        # signature on every Mach-O object and runs all three engines — and the
        # app bundle itself carries no engine tree.
        run: |
          set -o pipefail
          bash scripts/verify-engine-pack.sh \
            --pack "$HOME/Library/Application Support/app.ezconvert.desktop" \
            --app "/Applications/EZ Convert.app" --expect-arch arm64 2>&1 | tee verify-pack.log

      - name: The installed app must find the engines and convert
        run: |
          set -o pipefail
          set +e
          "/Applications/EZ Convert.app/Contents/MacOS/ez-convert" --diagnostics \
            --fixtures "${{ github.workspace }}/fixtures" --work "$RUNNER_TEMP/diag" 2>&1 | tee diag.log
          code=${PIPESTATUS[0]}
          set -e
          grep -q 'SUMMARY' diag.log || { echo "::error::the diagnostics run produced no summary"; exit 1; }
          grep -E '^engine ' diag.log | grep -q MISSING && { echo "::error::a required engine was not found"; exit 1; }
          if [ "$code" -ne 0 ]; then
            grep -E '^FAMILY .* FAIL' diag.log || true
            echo "::error::the installed app failed a conversion family"
            exit 1
          fi
          echo "installed app: 4/4 families converted"

      - name: Evidence
        if: always()
        run: bash packaging/macos/publish-evidence.sh install-test "${{ job.status }}" install.log install-pack.log verify-pack.log diag.log

  # ------------------------------------------------------------- evidence
  evidence:
    name: evidence (publish to macos-status)
    needs: [app, pack, install-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose run facts
        env:
          APP: ${{ needs.app.result }}
          PACK: ${{ needs.pack.result }}
          INSTALL: ${{ needs.install-test.result }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/facts
          cat > /tmp/facts/facts.json <<JSON
          {
            "run_id": ${GITHUB_RUN_ID},
            "sha": "${GITHUB_SHA}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "results": {"app_dmg": "${APP}", "engine_pack": "${PACK}", "install_test": "${INSTALL}"},
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat /tmp/facts/facts.json

      - name: Push the facts to macos-status
        # Same values as the compose step: a step's `env:` does not carry over to
        # the next step, and the commit message needs them (run #3 died on
        # "APP: unbound variable" here, after every macOS job had already run).
        env:
          APP: ${{ needs.app.result }}
          PACK: ${{ needs.pack.result }}
          INSTALL: ${{ needs.install-test.result }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin macos-status:refs/remotes/origin/macos-status 2>/dev/null || true
          if git checkout -q -B macos-status origin/macos-status 2>/dev/null; then :; else git checkout -q -B macos-status; fi
          mkdir -p "macos-status/run-${GITHUB_RUN_ID}"
          cp /tmp/facts/facts.json "macos-status/run-${GITHUB_RUN_ID}/"
          cp /tmp/facts/facts.json macos-status/latest.json
          git add -f macos-status
          git commit -q -m "macos-status: run ${GITHUB_RUN_ID} app=${APP} pack=${PACK} install=${INSTALL}" || echo "nothing to commit"
          git push origin macos-status || { git pull --rebase -q origin macos-status && git push origin macos-status; }
