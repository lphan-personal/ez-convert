name: windows-installer

# The Windows face of a release: an unsigned, per-user NSIS installer built on a
# GitHub-hosted Windows runner.
#
# Why this is its own workflow and not a job in build.yml: the matrix runs
# `tauri build --no-bundle --ci` on every push, deliberately, because bundling
# costs minutes and downloads two upstream payloads (the NSIS toolchain and the
# WebView2 offline installer, ~127 MB). Bundling here happens on demand, once
# per release, and the resulting .exe is the file users download.
#
# What this installer is NOT: it carries no conversion engines. `bundle.active`
# comes from `src-tauri/tauri.windows.conf.json` (targets `nsis`,
# `installMode: currentUser`, WebView2 `offlineInstaller`, VC runtime bundled);
# the engine payload lives in `src-tauri/tauri.bundle.windows.conf.json` and is
# only passed when the pack is staged into the tree. A release therefore ships
# the installer *and* `windows-engine-pack-x86_64.zip`, and the pairing is what
# is acceptance-tested (docs/PACKAGING-WINDOWS.md "Acceptance"): unpack the pack
# into `%LOCALAPPDATA%\EZ Convert\`, then `ez-convert.exe --diagnostics
# --fixtures <dir>` must print `SUMMARY families=4 pass=4 fail=0`.
#
# Nothing here is code-signed: there is no certificate in CI. The installer is
# documented as unsigned in the release body (SmartScreen More info -> Run
# anyway, docs/DISTRIBUTION.md).
#
# This job also measures the thing the build tree cannot: it installs the
# installer it just produced (silently, per-user, no elevation — the path a user
# gets, `%LOCALAPPDATA%\EZ Convert\`) and runs `--overlay-probe` against the
# *installed* `ez-convert.exe` through `scripts/overlay-probe.sh`. The probe is
# the gate: it exits non-zero unless every asserted check passes, and the step
# after it re-asserts `ok=true`, 15/15 checks, the elliptic window region, the
# corner belonging to another window and `WS_EX_NOACTIVATE` from the facts. The
# build-tree numbers live in `overlay-measure.yml`; do not quote those as "the
# shipped build".

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Free-form note recorded in the run manifest"
        required: false
        default: ""

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  installer:
    name: installer (windows-latest, NSIS, unsigned, engine-free)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Same pinned, digest-verified Tauri CLI as the build matrix: a swapped
      # tool binary fails here, not after a 400 MB installer is produced.
      - name: Install the Tauri CLI (pinned prebuilt, build-time tool)
        env:
          TAURI_CLI_VER: 2.12.4
        run: |
          set -euo pipefail
          asset="x86_64-pc-windows-msvc.zip"
          sum="3e8687fb184bd7f10ebd8642f7715f79f4a605c0694c142a21507e8a24dc0f8b"
          curl -fsSL -o cli.zip \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VER}/cargo-tauri-${asset}"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${sum}  cli.zip" | sha256sum -c -
          else
            echo "${sum}  cli.zip" | shasum -a 256 -c -
          fi
          export CLI_ZIP="$PWD/cli.zip" CLI_DIR="$HOME/.cargo/bin"
          mkdir -p "$CLI_DIR"
          if ! pwsh -NoProfile -NonInteractive \
              -Command 'Expand-Archive -LiteralPath $env:CLI_ZIP -DestinationPath $env:CLI_DIR -Force'; then
            tar -xf "$CLI_ZIP" -C "$CLI_DIR"
          fi
          chmod +x "$CLI_DIR/cargo-tauri" 2>/dev/null || true
          cargo tauri --version

      # Guard before the build, for the same reason build.yml has it: if an
      # engine payload ever reappears in the platform overlay, the bundler would
      # need staged files this job does not create, and every Windows build
      # would fail at cargo-build time.
      - name: The platform overlay must stay payload-free
        run: |
          set -eo pipefail
          cfg=src-tauri/tauri.windows.conf.json
          if grep -qE '"(externalBin|resources)"' "$cfg"; then
            echo "::error::$cfg declares externalBin/resources; the payload belongs in tauri.bundle.windows.conf.json"
            exit 1
          fi
          grep -q '"nsis"' "$cfg" || { echo "::error::$cfg lost its nsis target"; exit 1; }
          for d in src-tauri/binaries src-tauri/resources; do
            if [ -e "$d" ]; then
              echo "::error::$d must not exist in this job (engines ship as a separate pack)"
              exit 1
            fi
          done
          echo "payload-free windows build, nsis target present"

      # No --config: the Windows platform overlay is merged automatically, so
      # this is exactly what a user-facing build is (bundle.active true,
      # targets nsis). No --no-bundle: that is the flag the matrix uses.
      - name: tauri build (NSIS installer)
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo tauri build --ci 2>&1 | tee tauri-build.log

      - name: Stage + assert the installer
        id: stage
        env:
          TAURI_CLI_VER: 2.12.4
          NOTE_INPUT: ${{ inputs.note }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          exe=$(find src-tauri/target/release/bundle/nsis -maxdepth 1 -name '*.exe' | head -1 || true)
          [ -n "$exe" ] || { echo "::error::no NSIS installer was produced"; ls -la src-tauri/target/release/bundle 2>/dev/null || true; exit 1; }
          name=$(basename "$exe")
          cp "$exe" "artifacts/$name"
          size=$(wc -c < "artifacts/$name" | tr -d ' ')
          magic=$(head -c 2 "artifacts/$name")
          [ "$magic" = "MZ" ] || { echo "::error::$name is not a PE executable (magic '$magic')"; exit 1; }
          # Sanity band. The installer is the app shell plus the WebView2
          # offline installer (~127 MB) and the VC runtime: ~130-200 MB. An
          # engine-carrying installer is ~490 MB, so a big file here would mean
          # an engine payload leaked into the app bundle.
          if [ "$size" -lt 100000000 ] || [ "$size" -gt 300000000 ]; then
            echo "::error::$name is $size B, outside the engine-free band 100-300 MB"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "artifacts/$name" | cut -d' ' -f1)
          else
            sum=$(shasum -a 256 "artifacts/$name" | cut -d' ' -f1)
          fi
          # The note is a workflow input, so it is sanitised before it goes into
          # JSON: quotes and backslashes are stripped, never pasted raw.
          note=$(printf '%s' "${NOTE_INPUT:-}" | tr -d '"\\' | tr -d '\r\n')
          echo "$sum  $name" > artifacts/SHA256SUMS.txt
          {
            echo "{"
            echo "  \"os\": \"Windows\","
            echo "  \"file\": \"$name\","
            echo "  \"size_bytes\": $size,"
            echo "  \"sha256\": \"$sum\","
            echo "  \"bundle\": \"nsis\","
            echo "  \"install_mode\": \"currentUser\","
            echo "  \"signed\": false,"
            echo "  \"engines_in_installer\": false,"
            echo "  \"engine_pack\": \"windows-engine-pack-x86_64.zip (separate release asset)\","
            echo "  \"tauri_cli\": \"$TAURI_CLI_VER\","
            echo "  \"rustc\": \"$(rustc --version)\","
            echo "  \"run_id\": ${GITHUB_RUN_ID},"
            echo "  \"run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\","
            echo "  \"sha\": \"${GITHUB_SHA}\","
            echo "  \"note\": \"$note\""
            echo "}"
          } > artifacts/manifest.json
          cat artifacts/manifest.json
          echo "INSTALLER_FILE=$name" >> "$GITHUB_ENV"
          echo "INSTALLER_SIZE=$size" >> "$GITHUB_ENV"
          echo "INSTALLER_SHA=$sum" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------------
      # The installed build. Everything measured before this point came out of
      # the build tree (`overlay-measure.yml`); a user never runs that. These
      # steps install the installer that was just produced, the way a user does,
      # and measure the binary that lands on disk.
      # ---------------------------------------------------------------------
      - name: Install the installer silently, per-user (the path a user gets)
        id: install
        run: |
          set -uo pipefail
          exe="artifacts/$INSTALLER_FILE"
          [ -f "$exe" ] || { echo "::error::$exe is missing"; exit 1; }
          # /S is silent. NSIS `installMode: currentUser` puts it in
          # %LOCALAPPDATA%\EZ Convert\ and asks for no elevation. MSYS would
          # rewrite "/S" into a Windows path, so argument conversion is off for
          # this one call.
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' "$exe" /S > install.log 2>&1
          code=$?
          echo "installer exit=$code" | tee -a install.log
          [ "$code" -eq 0 ] || { echo "::error::the silent install exited $code (see install.log)"; exit 1; }

          local_appdata="$(cygpath -u "${LOCALAPPDATA:-$HOME/AppData/Local}")"
          installed="$(find "$local_appdata" -maxdepth 3 -type f -iname 'ez-convert.exe' 2>/dev/null | head -1)"
          [ -n "$installed" ] || {
            echo "::error::the silent install produced no ez-convert.exe under $local_appdata"
            ls -la "$local_appdata" 2>/dev/null | head -30 || true
            exit 1
          }
          # Per-user, no UAC: if the binary did not land under the user's profile
          # the installer asked for elevation and this is not the artifact users run.
          case "$installed" in
            "$local_appdata"/*) echo "per-user install: $installed" ;;
            *) echo "::error::$installed is not under $local_appdata - this was not a per-user install"; exit 1 ;;
          esac
          case "$installed" in
            *src-tauri*) echo "::error::$installed is the build tree, not the installed app"; exit 1 ;;
          esac
          magic="$(head -c 2 "$installed")"
          [ "$magic" = "MZ" ] || { echo "::error::$installed is not a PE executable (magic '$magic')"; exit 1; }
          size=$(wc -c < "$installed" | tr -d ' ')
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$installed" | cut -d' ' -f1)
          else
            sum=$(shasum -a 256 "$installed" | cut -d' ' -f1)
          fi
          {
            echo "INSTALLED_BIN=$installed"
            echo "INSTALLED_BIN_SIZE=$size"
            echo "INSTALLED_BIN_SHA256=$sum"
            echo "INSTALLED_DIR=$local_appdata/EZ Convert"
          } | tee -a install.log
          {
            echo "INSTALLED_BIN=$installed"
            echo "INSTALLED_BIN_SIZE=$size"
            echo "INSTALLED_BIN_SHA256=$sum"
          } >> "$GITHUB_ENV"

      - name: Make sure `python3` resolves (scripts/overlay-probe.sh calls it)
        # Windows images ship python; this is the shim the card asked for, and it
        # runs as a check rather than an assumption. A missing interpreter would
        # otherwise turn into "no facts written" two steps later.
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python3 -V 2>&1 | tee python.log
            exit 0
          fi
          echo "python3 missing - shimming the runner's python" | tee -a python.log
          py="$(command -v python || command -v py || true)"
          [ -n "$py" ] || { echo "::error::no python on this runner, and the probe needs one"; exit 1; }
          mkdir -p "$HOME/bin"
          printf '#!/usr/bin/env bash\nexec "%s" "$@"\n' "$py" > "$HOME/bin/python3"
          chmod +x "$HOME/bin/python3"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/python3" -V 2>&1 | tee -a python.log

      - name: The wheel overlay, measured from the INSTALLED app (must pass every check)
        run: |
          set -o pipefail
          echo "measuring $INSTALLED_BIN (sha256 $INSTALLED_BIN_SHA256)" | tee installed-overlay.log
          BIN="$INSTALLED_BIN" HOLD=8 bash scripts/overlay-probe.sh installed-overlay-evidence 2>&1 | tee -a overlay-verdict.log

      - name: Assert the installed-build facts (ok, 15/15, ellipse, corner, no-activate)
        # `overlay-probe.sh` already exits with the probe's code (0 only when every
        # asserted check passed). This re-reads the verdict on purpose: the claim a
        # release makes is these five facts, so they are named here rather than
        # inferred from a green step.
        if: always()
        run: |
          set -euo pipefail
          [ -f overlay-verdict.log ] || { echo "::error::no verdict log - the probe never ran"; exit 1; }
          grep -q '^OVERLAY_PROBE ok=true' overlay-verdict.log \
            || { echo "::error::the installed app's overlay probe did not report ok=true"; exit 1; }
          pass=$(grep -c '^OVERLAY_CHECK .*=pass$' overlay-verdict.log || true)
          fail=$(grep -c '^OVERLAY_CHECK .*=FAIL$' overlay-verdict.log || true)
          echo "asserted checks: ${pass} pass, ${fail} fail (expected 15 and 0)"
          [ "$pass" -eq 15 ] || { echo "::error::expected 15 asserted checks to pass on the installed build, saw $pass"; exit 1; }
          [ "$fail" -eq 0 ] || { echo "::error::$fail asserted check(s) failed on the installed build"; exit 1; }
          for name in window-region-is-ellipse corner-belongs-to-another-window \
                      window-non-activating click-through-sampled rendered-within-150ms; do
            grep -q "^OVERLAY_CHECK ${name}=pass$" overlay-verdict.log \
              || { echo "::error::$name did not pass on the installed build"; exit 1; }
          done
          {
            echo "INSTALLED_OVERLAY ok=true checks=${pass}/15"
            echo "INSTALLED_OVERLAY binary=$INSTALLED_BIN sha256=$INSTALLED_BIN_SHA256"
            echo "INSTALLED_OVERLAY window-region-is-ellipse=pass corner-belongs-to-another-window=pass window-non-activating=pass"
          } | tee -a installed-overlay.log

      - name: Upload the installed-build overlay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ez-convert-windows-installed-overlay
          path: |
            installed-overlay-evidence/**
            overlay-verdict.log
            installed-overlay.log
            install.log
            python.log
          if-no-files-found: warn

      - name: Upload the installer
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ez-convert-windows-nsis
          path: |
            artifacts/**
            src-tauri/tauri-build.log
          if-no-files-found: error
          retention-days: 30

      # Evidence readable with Contents scope alone (this account's token can
      # see the Actions API, but a branch record survives artifact expiry).
      - name: Publish the build record to ci-windows-installer
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_NAME: ez-convert-windows-nsis
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The installed-build verdict, read back from the log the assertion step
          # wrote, so the record cannot claim a pass the job did not make.
          overlay_ok="$(grep -o 'INSTALLED_OVERLAY ok=[a-z]*' installed-overlay.log 2>/dev/null | tail -1 | cut -d= -f2 || true)"
          [ -n "$overlay_ok" ] || overlay_ok="unknown"
          overlay_checks="$(grep -o 'INSTALLED_OVERLAY checks=[0-9]*/15' installed-overlay.log 2>/dev/null | tail -1 | cut -d= -f2 || true)"
          [ -n "$overlay_checks" ] || overlay_checks="unknown"
          git checkout -B ci-windows-installer
          mkdir -p "ci-installer/${GITHUB_RUN_ID}/overlay"
          cp -f overlay-verdict.log installed-overlay.log install.log python.log \
            "ci-installer/${GITHUB_RUN_ID}/" 2>/dev/null || true
          cp -f installed-overlay-evidence/overlay-facts.json \
                installed-overlay-evidence/overlay-shot.json \
                installed-overlay-evidence/overlay-screen.png \
                installed-overlay-evidence/overlay-verdict.txt \
                installed-overlay-evidence/overlay-run.log \
            "ci-installer/${GITHUB_RUN_ID}/overlay/" 2>/dev/null || true
          mkdir -p ci-installer
          {
            echo "{"
            echo "  \"job_status\": \"$JOB_STATUS\","
            echo "  \"run_id\": ${GITHUB_RUN_ID},"
            echo "  \"run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\","
            echo "  \"sha\": \"${GITHUB_SHA}\","
            echo "  \"artifact_name\": \"$ARTIFACT_NAME\","
            echo "  \"artifact_id\": \"${ARTIFACT_ID}\","
            echo "  \"artifact_url\": \"${ARTIFACT_URL}\","
            echo "  \"file\": \"${INSTALLER_FILE:-}\","
            echo "  \"size_bytes\": \"${INSTALLER_SIZE:-}\","
            echo "  \"sha256\": \"${INSTALLER_SHA:-}\","
            echo "  \"installed_bin\": \"${INSTALLED_BIN:-}\","
            echo "  \"installed_bin_sha256\": \"${INSTALLED_BIN_SHA256:-}\","
            echo "  \"installed_overlay_ok\": \"$overlay_ok\","
            echo "  \"installed_overlay_checks\": \"$overlay_checks\","
            echo "  \"installed_overlay_evidence\": \"ci-installer/${GITHUB_RUN_ID}/overlay/\","
            echo "  \"published_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > "ci-installer/${GITHUB_RUN_ID}.json"
          cp "ci-installer/${GITHUB_RUN_ID}.json" ci-installer/latest.json
          cat ci-installer/latest.json
          git add -f ci-installer
          git commit -m "ci-installer: $JOB_STATUS in run ${GITHUB_RUN_ID} (installed overlay ok=$overlay_ok)" || echo "nothing to commit"
          git push --force origin ci-windows-installer
          [ "$overlay_ok" = "true" ] || { echo "::error::the published record says the installed overlay did not pass"; exit 1; }
