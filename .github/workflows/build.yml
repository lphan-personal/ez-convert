name: build

# Everything OS-specific happens here, not in the Linux agent container:
#   - push / PR        : build matrix (3 OS) + ffmpeg licence gate
#   - workflow_dispatch: same, plus the requested spike script
# See README "Running a spike on a runner".
#
# Every run publishes its own verdict to the `ci-status` branch
# (ci-status/latest.json + ci-status/<run_id>.json), and every failing OS job
# publishes its cargo log to its own `ci-logs-<os>` branch. Both exist so build
# results can be read with nothing but Contents scope.

on:
  push:
    branches: [main]
    # Cost control (decision A, 2026-11-02): prose-only commits must not rebuild
    # three operating systems. Anything that can change shipped behaviour still
    # runs the matrix - including the licence inventory, which the policy gate reads.
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "scripts/**"
      - "fixtures/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "docs/LICENSES.md"
      - "docs/shipped-inventory.tsv"
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "ui/**"
      - "scripts/**"
      - "fixtures/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "docs/LICENSES.md"
      - "docs/shipped-inventory.tsv"
  workflow_dispatch:
    inputs:
      spike_id:
        description: "Spike to execute on this runner"
        required: true
        default: none
        type: choice
        options:
          - none
          - s0-runner-smoke
          - s1
          - s2
          - s3
      spike_args:
        description: "Optional free-form args passed to the spike via SPIKE_ARGS"
        required: false
        default: ""
        type: string

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  # A push that supersedes an in-flight run wins: the older 3-OS matrix is
  # cancelled instead of queueing behind it. Serialising was the reason a burst
  # of commits looked like "CI stopped running" — the tip's evidence only lands
  # when the queue drains. Cancelled runs publish nothing, so `ci-status` always
  # ends on the newest run that was allowed to finish.
  cancel-in-progress: true

permissions:
  contents: read

# Windows runners default `run:` to PowerShell; every step here is POSIX shell
# (git bash ships on all three images). Without this, `set -o pipefail` and
# `tee` break the windows-latest job.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- build x3
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Free-tier minutes are the budget: a hung runner must not burn an hour.
    # A cold run is ~8-12 min per platform including the release build.
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Cost control (decision A, 2026-11-02): macOS bills at 10x the Linux rate
      # ($0.08/min vs $0.008/min). Measured on this repo: macos-latest was 14% of
      # job wall time but 49% of billed minutes. Every push/PR still builds Linux +
      # Windows; the macOS leg is added only for workflow_dispatch and v* tag
      # pushes, so the full 3-OS matrix is the release evidence rather than the
      # per-commit signal. (A job-level `if:` cannot see `matrix`, so the leg is
      # selected here in the strategy instead of being skipped after allocation.)
      matrix:
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      # Liveness marker: pushed as soon as the job starts, before any build work.
      # Without it, a job that dies mid-run is indistinguishable from a run that
      # never started — which is exactly how 17 hours of silence looked on this
      # repo (see evidence/p1-ci-pipeline.md).
      - name: Record job start to ci-start-${{ matrix.os }}
        env:
          OS_SLUG: ${{ matrix.os }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-start
          printf '{"os":"%s","run_id":%s,"run_url":"%s/%s/actions/runs/%s","sha":"%s","started_at":"%s"}\n' \
            "$OS_SLUG" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ci-start/latest.json
          git checkout -B "ci-start-${OS_SLUG}"
          git add -f ci-start
          git commit -q -m "ci-start: ${OS_SLUG} run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push --force origin "ci-start-${OS_SLUG}"

      - name: Install Tauri 2 Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo build
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo build --locked --all-targets 2>&1 | tee build.log

      - name: cargo test (placeholder suite)
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee test.log

      # --------------------------------------------- Tauri app (windows/macOS)
      # The two shipping platforms build the actual desktop app here and upload
      # it unsigned. The CLI is a build-time tool (never shipped to users), so it
      # is fetched as an official prebuilt release and sha256-pinned instead of
      # costing minutes of `cargo install` on every run. Nothing built with it is
      # signed: signing is a release step with credentials CI must not hold.
      - name: Install the Tauri CLI (pinned prebuilt, build-time tool)
        if: runner.os != 'Linux'
        env:
          TAURI_CLI_VER: 2.12.4
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows)
              asset="x86_64-pc-windows-msvc.zip"
              sum="3e8687fb184bd7f10ebd8642f7715f79f4a605c0694c142a21507e8a24dc0f8b"
              ;;
            macOS)
              if [ "$(uname -m)" = "arm64" ]; then
                asset="aarch64-apple-darwin.zip"
                sum="f71a34ada728ca2d1a51c28d6d21639e1e080898ec69ec8d49c5da3b7e8bc1be"
              else
                asset="x86_64-apple-darwin.zip"
                sum="164d184c0e50800dcae7bb31f0815066ebd27efc3e3bb73117974bcd2e982192"
              fi
              ;;
            *)
              echo "::error::no pinned Tauri CLI for $RUNNER_OS"
              exit 1
              ;;
          esac
          curl -fsSL -o cli.zip \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VER}/cargo-tauri-${asset}"
          # The pin is the point: a swapped tool binary fails here, not later.
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${sum}  cli.zip" | sha256sum -c -
          else
            echo "${sum}  cli.zip" | shasum -a 256 -c -
          fi
          export CLI_ZIP="$PWD/cli.zip" CLI_DIR="$HOME/.cargo/bin"
          mkdir -p "$CLI_DIR"
          if ! pwsh -NoProfile -NonInteractive \
              -Command 'Expand-Archive -LiteralPath $env:CLI_ZIP -DestinationPath $env:CLI_DIR -Force'; then
            tar -xf "$CLI_ZIP" -C "$CLI_DIR"
          fi
          chmod +x "$CLI_DIR/cargo-tauri" 2>/dev/null || true
          cargo tauri --version

      # The licence assertion on the platform that ships, not just on Linux:
      # (a) every ffmpeg this checkout would bundle must report enable-gpl=0,
      # (b) the gate must REJECT a deliberately GPL ffmpeg and accept an LGPL one,
      #     so a green run without the rejection line is not trusted.
      - name: Licence assertion - bundled ffmpeg must be enable-gpl=0
        if: runner.os != 'Linux'
        run: |
          set -o pipefail
          bash scripts/license-assert.sh --scan 2>&1 | tee license-scan.log

      - name: Licence assertion - a deliberately GPL ffmpeg must be rejected
        if: runner.os != 'Linux'
        run: |
          set -o pipefail
          bash scripts/license-assert.sh --selftest 2>&1 | tee license-selftest.log

      - name: Build the Tauri app (release, unsigned, no installer yet)
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo tauri build --no-bundle --ci 2>&1 | tee tauri-build.log

      # The binary plus a manifest that says exactly what was built. The manifest
      # travels inside the artifact (self-describing) and is republished to the
      # ci-artifacts-<os> branch (auditable with Contents scope alone).
      - name: Stage the unsigned artifact + manifest
        id: stage
        if: runner.os != 'Linux'
        env:
          TAURI_CLI_VER: 2.12.4
        run: |
          set -euo pipefail
          mkdir -p artifacts
          case "$RUNNER_OS" in
            Windows) src="src-tauri/target/release/ez-convert.exe"; out="ez-convert-windows-x86_64.exe" ;;
            macOS)   src="src-tauri/target/release/ez-convert";     out="ez-convert-macos-$(uname -m)" ;;
            *) echo "::error::unsupported runner $RUNNER_OS"; exit 1 ;;
          esac
          [ -f "$src" ] || { echo "::error::the Tauri build produced no binary at $src"; exit 1; }
          cp "$src" "artifacts/$out"
          chmod +x "artifacts/$out" 2>/dev/null || true
          size=$(wc -c < "artifacts/$out" | tr -d ' ')
          sum=$( (sha256sum "artifacts/$out" 2>/dev/null || shasum -a 256 "artifacts/$out") | cut -d' ' -f1)
          echo "$sum  $out" > artifacts/SHA256SUMS.txt
          {
            echo "{"
            echo "  \"os\": \"$RUNNER_OS\","
            echo "  \"file\": \"$out\","
            echo "  \"size_bytes\": $size,"
            echo "  \"sha256\": \"$sum\","
            echo "  \"signed\": false,"
            echo "  \"bundle\": false,"
            echo "  \"bundle_note\": \"bundle.active is false; installers are a later packaging step\","
            echo "  \"tauri_cli\": \"$TAURI_CLI_VER\","
            echo "  \"rustc\": \"$(rustc --version)\","
            echo "  \"run_id\": ${GITHUB_RUN_ID},"
            echo "  \"run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\","
            echo "  \"sha\": \"${GITHUB_SHA}\""
            echo "}"
          } > artifacts/manifest.json
          cp artifacts/manifest.json artifacts-manifest.json
          cat artifacts/manifest.json
          {
            echo "ART_FILE=$out"
            echo "ART_SIZE=$size"
            echo "ART_SHA=$sum"
          } >> "$GITHUB_ENV"

      - name: Upload the unsigned artifact
        id: upload
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ez-convert-${{ runner.os }}-unsigned
          path: |
            artifacts/**
            src-tauri/tauri-build.log
            license-scan.log
            license-selftest.log
          if-no-files-found: error
          retention-days: 30

      # The upload step's own id/url is the proof the artifact exists. Recording
      # it on a branch keeps the evidence readable without the Actions API, which
      # this account's token cannot reach (403).
      - name: Publish the artifact record to ci-artifacts-${{ matrix.os }}
        if: always() && runner.os != 'Linux'
        env:
          OS_SLUG: ${{ matrix.os }}
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_NAME: ez-convert-${{ runner.os }}-unsigned
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-artifacts
          {
            echo "{"
            echo "  \"os\": \"$OS_SLUG\","
            echo "  \"job_status\": \"$JOB_STATUS\","
            echo "  \"run_id\": ${GITHUB_RUN_ID},"
            echo "  \"run_attempt\": ${GITHUB_RUN_ATTEMPT},"
            echo "  \"run_url\": \"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\","
            echo "  \"sha\": \"${GITHUB_SHA}\","
            echo "  \"artifact_name\": \"$ARTIFACT_NAME\","
            echo "  \"artifact_id\": \"${ARTIFACT_ID}\","
            echo "  \"artifact_url\": \"${ARTIFACT_URL}\","
            echo "  \"file\": \"${ART_FILE:-}\","
            echo "  \"size_bytes\": \"${ART_SIZE:-}\","
            echo "  \"sha256\": \"${ART_SHA:-}\","
            echo "  \"signed\": false,"
            echo "  \"published_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\""
            echo "}"
          } > "ci-artifacts/${GITHUB_RUN_ID}.json"
          cp "ci-artifacts/${GITHUB_RUN_ID}.json" ci-artifacts/latest.json
          cat ci-artifacts/latest.json
          git checkout -B "ci-artifacts-${OS_SLUG}"
          git add -f ci-artifacts
          git commit -m "ci-artifacts: ${OS_SLUG} ${JOB_STATUS} in run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push --force origin "ci-artifacts-${OS_SLUG}"

      # The skeleton was authored without a local Rust toolchain, so the lock
      # file is born in CI. P2/U1 commit it, then builds can use --locked.
      - name: Export Cargo.lock for commit
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 30

      # Evidence channel: every OS publishes its own result to ci-evidence-<os>
      # (status + test summary, plus the cargo log when it failed). Readable
      # with Contents scope alone — no Actions API, no log download.
      - name: Publish evidence to ci-evidence-${{ matrix.os }}
        if: always()
        env:
          OS_SLUG: ${{ matrix.os }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p ci-evidence
          # Test summary line, e.g. "test result: ok. 8 passed; 0 failed; ..."
          summary=$(grep -hE '^test result:' src-tauri/test.log 2>/dev/null | head -1 || true)
          printf '{\n  "os": "%s",\n  "run_id": %s,\n  "run_url": "%s/%s/actions/runs/%s",\n  "sha": "%s",\n  "job_status": "%s",\n  "cargo_build_ok": %s,\n  "test_summary": "%s",\n  "rustc": "%s"\n}\n' \
            "$OS_SLUG" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$GITHUB_SHA" "$JOB_STATUS" \
            "$([ "$JOB_STATUS" = "success" ] && echo true || echo false)" \
            "${summary//\"/}" "$(rustc --version 2>/dev/null || echo unknown)" \
            > "ci-evidence/latest.json"
          if [ "$JOB_STATUS" != "success" ]; then
            for f in src-tauri/build.log src-tauri/test.log; do
              [ -f "$f" ] && cp "$f" "ci-evidence/$(basename "$f")"
            done
          fi
          cat ci-evidence/latest.json
          git checkout -B "ci-evidence-${OS_SLUG}"
          git add -f ci-evidence
          git commit -m "ci-evidence: ${OS_SLUG} ${JOB_STATUS} in run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push --force origin "ci-evidence-${OS_SLUG}"

  # ------------------------------------------------------- ffmpeg licence gate
  license-assert:
    name: license-assert (bundled binaries must be GPL/AGPL-clean)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Proves the gate is not a no-op: a fake GPL build must be rejected and
      # a fake LGPL build must pass before we trust the real scan.
      - name: Gate self-test (GPL fixture must fail, LGPL fixture must pass)
        run: bash scripts/license-assert.sh --selftest

      - name: Assert every bundled ffmpeg/ffprobe reports enable-gpl=0
        run: bash scripts/license-assert.sh --scan

      # Q2 gate: the shipped-artifact inventory must contain no GPL-contaminated
      # binary and no AGPL term anywhere, and the gate itself must fail the build
      # on deliberately contaminated fixtures (unattributed binary = the jbigkit
      # shape, GPL/AGPL rows, GPL-configured ffmpeg).
      - name: Shipped-inventory licence gate (docs/shipped-inventory.tsv)
        run: bash scripts/dist-license-gate.sh --check-inventory

      - name: Dist licence gate self-test (contamination must fail the build)
        run: bash scripts/dist-license-gate.sh --selftest

  # ------------------------------------------- reference policy gate (docs/PRIOR_ART.md)
  policy-check:
    name: policy-check (R1-R3 deny-list, R6 licence drift)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # R3/R1: prior-art names are allowed ONLY inside the two policy files
      # (docs/REFERENCE_POLICY.md §2). The pattern is written as [f]ilee /
      # [k]nifelemon so this file does not itself contain a deny-list literal.
      - name: Deny-list scan (prior-art names outside the policy files)
        run: |
          set -euo pipefail
          hits=$(grep -rniE '\b[f]ilee\b|\b[k]nifelemon\b' . \
            --exclude-dir=.git --exclude-dir=target \
            | grep -vE '^\./docs/(PRIOR_ART|REFERENCE_POLICY)\.md:' || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            echo "::error::R3 violation - prior-art name outside docs/PRIOR_ART.md and docs/REFERENCE_POLICY.md"
            exit 1
          fi
          echo "deny-list clean"

      # R1/R2: no C#/.NET surface, no vendored tree, no submodule.
      - name: No C#/.NET, no submodule
        run: |
          set -euo pipefail
          bad=$(find . -path ./.git -prune -o \
            \( -name '*.cs' -o -name '*.xaml' -o -name '*.csproj' -o -name '*.sln' \) -print | head -20)
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            echo "::error::R2 violation - C#/.NET files present"
            exit 1
          fi
          [ -f .gitmodules ] && { echo "::error::R1 violation - submodule present"; exit 1; }
          echo "no C#/.NET, no submodule"

      # R6: every dependency is recorded, generated from the locked graph.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # ARCHITECTURE §2.2: model/ must stay Tauri-free, process-free, crate-free.
      # This is the boundary that makes detection and the matrix unit-testable.
      - name: Model boundary (model/ is pure)
        run: bash scripts/check-model-purity.sh

      # The same tests `cargo test` runs, compiled without the Tauri shell: proves
      # the model is testable on a host with no GTK/WebKit.
      - name: Model tests without the shell
        run: bash scripts/test-model.sh

      # The engine layer (argv builders, planner, spawn contract, verifiers) is
      # std-only apart from `lofty`, which the harness stubs. This is where the
      # "ffmpeg never touches a still image" test runs (ARCHITECTURE §6.3).
      - name: Engine tests without the shell
        run: bash scripts/test-engine.sh

      # The engine pack's version/checksum manifest is pure python, so it is
      # tested here (ubuntu, seconds) and again as the first step of the macOS
      # pack job — before that job spends billed macOS minutes.
      - name: Engine pack manifest (seal/verify fails closed)
        run: bash scripts/test-pack-manifest.sh

      # The matrix and the evidence index are generated; drift fails the test
      # above, and this step prints the diff to make the fix obvious.
      - name: Generated docs are in sync
        run: |
          set -euo pipefail
          before=$(sha256sum docs/DETECTION.md evidence/ROUTES.md)
          rustc --edition 2021 -o /tmp/model-tables scripts/model-tables.rs
          /tmp/model-tables --write >/dev/null
          after=$(sha256sum docs/DETECTION.md evidence/ROUTES.md)
          if [ "$before" != "$after" ]; then
            echo "::error::docs/DETECTION.md or evidence/ROUTES.md was out of date; run '/tmp/model-tables --write'"
            git --no-pager diff -- docs/DETECTION.md evidence/ROUTES.md
            exit 1
          fi
          echo "generated docs in sync"

      - name: docs/LICENSES.md matches the locked dependency graph
        run: python3 scripts/gen-licenses.py --check

  # ------------------------------------------------- Q3 end-to-end suite
  # One real conversion per advertised direction (matrix Proven + the document
  # pipeline's own proven routes), with a per-direction PASS/FAIL table, a
  # metadata-policy assertion per family, and planted-fault controls that must
  # be caught. The engines here are test-only apt builds; the *shipped* dist is
  # built and licence-checked elsewhere (license-assert).
  e2e:
    name: e2e (one run per advertised direction)
    runs-on: ubuntu-latest
    # Free-tier minutes are the budget. Run 59's e2e leg sat in one step for
    # 90+ minutes with no cap, and because `report` needs it, the whole run's
    # verdict never reached ci-status. Every job here carries a cap now.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Test-only engines: apt builds on the runner. The *shipped* dist is built
      # and licence-checked elsewhere (license-assert); nothing here is bundled.
      - name: Install engines
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvips-tools ffmpeg libreoffice-core libreoffice-writer \
            libreoffice-calc libreoffice-impress fonts-dejavu-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: End-to-end suite (per-direction table)
        env:
          EZC_E2E_WORK: ${{ github.workspace }}/.e2e-work
          EZC_E2E_REPORT: ${{ github.workspace }}/e2e-report
          EZC_VIPS_DIR: /usr/bin
          EZC_FFMPEG_DIR: /usr/bin
          EZC_SOFFICE_DIR: /usr/lib/libreoffice/program
        run: |
          set -o pipefail
          bash scripts/e2e.sh 2>&1 | tee e2e.log

      # A green run only means something if the gate can go red: delete one
      # converted output before it is checked and require a FAIL row + exit 1.
      - name: Fault injection must fail the run
        env:
          EZC_E2E_WORK: ${{ github.workspace }}/.e2e-inject
          EZC_VIPS_DIR: /usr/bin
          EZC_FFMPEG_DIR: /usr/bin
          EZC_SOFFICE_DIR: /usr/lib/libreoffice/program
        run: |
          set +e
          bash scripts/e2e.sh --media-only --inject=drop-output > inject.log 2>&1
          code=$?
          cat inject.log
          if [ "$code" -eq 0 ]; then
            echo "::error::the suite reported success after a conversion was sabotaged"
            exit 1
          fi
          grep -q 'SUMMARY RED' inject.log || {
            echo "::error::injected fault produced no red summary"
            exit 1
          }
          echo "fault injection produced exit $code and a red summary"

      - name: Upload the per-direction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q3-e2e-report
          path: |
            e2e-report/**
            e2e.log
          if-no-files-found: warn
          retention-days: 30

  # ------------------------------------------------------------- spike runner
  spike:
    name: spike (${{ inputs.spike_id }})
    if: github.event_name == 'workflow_dispatch' && inputs.spike_id != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri 2 Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ffmpeg (spike baseline)
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run spike ${{ inputs.spike_id }}
        env:
          SPIKE_ID: ${{ inputs.spike_id }}
          SPIKE_ARGS: ${{ inputs.spike_args }}
        run: |
          set -euo pipefail
          script="spikes/${SPIKE_ID}/run.sh"
          if [ ! -f "$script" ]; then
            echo "::error file=${script}::spike '${SPIKE_ID}' has no run.sh yet"
            exit 1
          fi
          mkdir -p "spikes/${SPIKE_ID}/out"
          bash "$script"

      - name: Upload spike artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-${{ inputs.spike_id }}
          path: spikes/${{ inputs.spike_id }}/out
          if-no-files-found: warn
          retention-days: 30

  # --------------------------------------------------------- verdict publisher
  report:
    name: report (publish run verdict to ci-status)
    needs: [build, license-assert, policy-check, e2e, spike]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BUILD_RESULT: ${{ needs.build.result }}
      LICENSE_RESULT: ${{ needs.license-assert.result }}
      POLICY_RESULT: ${{ needs.policy-check.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      SPIKE_RESULT: ${{ needs.spike.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose verdict JSON
        run: |
          set -euo pipefail
          mkdir -p ci-status
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > "ci-status/${GITHUB_RUN_ID}.json" <<JSON
          {
            "run_id": ${GITHUB_RUN_ID},
            "run_number": ${GITHUB_RUN_NUMBER},
            "run_attempt": ${GITHUB_RUN_ATTEMPT},
            "run_url": "${run_url}",
            "event": "${GITHUB_EVENT_NAME}",
            "ref": "${GITHUB_REF_NAME}",
            "sha": "${GITHUB_SHA}",
            "trigger_inputs": {"spike_id": "${SPIKE_ID_INPUT:-}"},
            "results": {
              "build_matrix_3_os": "${BUILD_RESULT}",
              "license_assert": "${LICENSE_RESULT}",
              "policy_check": "${POLICY_RESULT}",
              "e2e": "${E2E_RESULT}",
              "spike": "${SPIKE_RESULT}"
            },
            "published_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cp "ci-status/${GITHUB_RUN_ID}.json" ci-status/latest.json
          cat ci-status/latest.json
        env:
          SPIKE_ID_INPUT: ${{ inputs.spike_id }}

      - name: Publish ci-status branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep every run's verdict: base this commit on the existing ci-status
          # branch instead of resetting it to main's tree, so ci-status/<run_id>.json
          # accumulates. The previous force-push wiped history, which is why "did a
          # run even start after 06:28Z?" was unanswerable from the branch alone.
          mkdir -p "$RUNNER_TEMP/verdict"
          mv ci-status "$RUNNER_TEMP/verdict/ci-status"
          git fetch -q origin ci-status:refs/remotes/origin/ci-status 2>/dev/null || true
          if ! git checkout -q -B ci-status origin/ci-status 2>/dev/null; then
            echo "ci-status branch absent or unreadable; starting a fresh history"
            git checkout -q -B ci-status
          fi
          mkdir -p ci-status
          cp "$RUNNER_TEMP"/verdict/ci-status/*.json ci-status/
          git add -f ci-status
          git commit -q -m "ci-status: run ${GITHUB_RUN_ID} build=${BUILD_RESULT} license=${LICENSE_RESULT} spike=${SPIKE_RESULT}"
          # Fast-forward normally; the lease-protected push only covers the case
          # where two report jobs overlapped before cancel-in-progress landed.
          git push origin ci-status || git push --force-with-lease origin ci-status
