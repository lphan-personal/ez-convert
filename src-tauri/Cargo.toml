[package]
name = "ez-convert"
version = "0.0.1"
description = "EZ Convert - local media conversion with a radial wheel UI"
authors = ["lphan-personal"]
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
# Tauri 2 convention: the app logic lives in a lib so mobile targets and
# integration tests can reuse it; main.rs stays a thin shim.
name = "ez_convert_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Folder/file pickers for "Add files" and the chosen-output-folder control.
# A native dialog, not a shell-out: engine/ keeps exclusive ownership of
# std::process::Command (ARCHITECTURE.md §2.2).
tauri-plugin-dialog = "2"
# Settings are a JSON document we own (ARCHITECTURE.md §15). serde parses our
# own format; it is not a third-party file parser.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Audio tag + cover-art carry-over after the ffmpeg encode (ARCHITECTURE.md §6.3,
# card C2). Pure Rust, no native dependency; reads/writes ID3v2, Vorbis comments,
# MP4 ilst and FLAC pictures. MIT — see docs/LICENSES.md.
lofty = "0.22"
# SHA-256 for the publication record and the undo journal's delete guard
# (ARCHITECTURE.md §9.4, §13; card C4). RustCrypto, MIT OR Apache-2.0. Already in
# the locked dependency graph transitively, so this is a direct-dependency pin,
# not a new crate — docs/LICENSES.md lists it either way.
sha2 = "0.10"

# macOS only: the overlay needs AppKit itself.
#   - `NSEvent.mouseLocation` + `NSScreen.screens` are the cursor and monitor
#     geometry (ARCHITECTURE.md §10.5, which used to read "PLANNED: unmeasured");
#   - `NSWindow.ignoresMouseEvents` is the click-through read-back the acceptance
#     probe asserts on.
# All three crates are already in the graph transitively (tao/tauri use them), so
# this is a direct-dependency pin with features, not a new dependency tree. MIT OR
# Apache-2.0 — see docs/LICENSES.md.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSScreen",
    "NSEvent",
    "NSWindow",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
